; Example BLE target assumes Arduino Nano 33 BLE. Adjust if using a different board.
[platformio]
default_envs = thomas, guy_manuel

[env]
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel
build_flags = -std=gnu++11 -I src

[env:thomas]
platform = atmelavr
board = uno
build_flags = ${env.build_flags} -I helmets/thomas

[env:guy_manuel]
platform = atmelavr
board = uno
build_flags = ${env.build_flags} -I helmets/guy_manuel

[env:guy_manuel_ble]
platform = nordicnrf52
board = nano33ble
build_flags = ${env.build_flags} -I helmets/guy_manuel -D DAFTY_ENABLE_BLE
lib_deps =
    ${env.lib_deps}
    arduino-libraries/ArduinoBLE
    adafruit/Adafruit GFX Library

[platformio]
default_envs = helmet1

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel
build_flags = -std=gnu++11

[env:helmet1]
build_flags = ${env.build_flags} -I src -I helmets/helmet1

[env:helmet2]
build_flags = ${env.build_flags} -I src -I helmets/helmet2

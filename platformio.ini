[platformio]
default_envs = guy_manuel

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel
build_flags = -std=gnu++11

[env:guy_manuel]
build_flags = ${env.build_flags} -I src -I helmets/guy_manuel

[env:thomas]
build_flags = ${env.build_flags} -I src -I helmets/thomas
